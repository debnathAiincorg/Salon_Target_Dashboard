# Gold asset value matching dashboard (files in gold-asset-value-matching/).
#
# Runs every day at 08:00 IST, when Power Automate sends the repository dispatch
# event "update-gold-dashboard" (repository = Salon_Target_Dashboard), or with the
# "Run workflow" button. The refreshed data and the two generated pages are
# committed; GitHub Pages republishes the site by itself.
#
# Secrets: the Gold SharePoint file is read with its own Azure app, so its login
# is stored as GOLD_AZURE_CLIENT_ID / GOLD_AZURE_CLIENT_SECRET (the Salon dashboard
# already uses AZURE_CLIENT_ID / AZURE_CLIENT_SECRET). Both apps are in the same
# tenant, so AZURE_TENANT_ID is shared.

name: Update Gold Dashboard

on:
  repository_dispatch:
    types: [update-gold-dashboard]
  schedule:
    # 30 2 * * * (UTC) = 08:00 IST every day (IST is UTC+5:30)
    - cron: "30 2 * * *"
  workflow_dispatch:

concurrency:
  group: gold-dashboard
  cancel-in-progress: false

permissions:
  contents: write

defaults:
  run:
    working-directory: gold-asset-value-matching

jobs:
  update-dashboard:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: gold-asset-value-matching/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      # pip only installs the playwright package; this downloads Chromium and the
      # OS libraries it needs on the Ubuntu runner.
      - name: Install Playwright browser (Chromium)
        run: playwright install --with-deps chromium

      # If this fails (e.g. Cloudflare blocks the runner) the job stops here, so a
      # bad fetch never overwrites a good dashboard.
      - name: Fetch today's Tanishq gold rate
        run: python fetch_tanishq_gold_rate.py

      # Only on failure: the script saves debug_screenshot.png when it times out
      # waiting for the rate table, to show what was on screen.
      - name: Upload debug screenshot on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tanishq-debug-screenshot
          path: gold-asset-value-matching/debug_screenshot.png

      - name: Fetch gold inventory from SharePoint
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.GOLD_AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.GOLD_AZURE_CLIENT_SECRET }}
        run: python fetch_excel_data.py

      # A failure here should not stop the rest: the main gold dashboard does not
      # use this data, and compair_to_other_rate.py falls back to each source's
      # last known rate.
      - name: Fetch Kolkata rate comparison data
        continue-on-error: true
        run: python compair_to_other_rate.py

      - name: Build gold_all_ditails_with_table.html
        run: python build_gold_all_ditails_with_table.py

      - name: Build Gold_asset_value_matching.html
        run: python build_gold_asset_value_matching.py

      - name: Commit and push updated data files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add fetch_tanishq_gold_rate.json fetch_excel_data.json compair_to_other_rate.json gold_all_ditails_with_table.html Gold_asset_value_matching.html
          if git diff --cached --quiet; then
            echo "No changes to commit - skipping."
            exit 0
          fi
          git commit -m "chore: update gold dashboard data ($(date -u +'%Y-%m-%d'))"
          # The Salon and Claude API workflows push to the same branch: pull their commits first
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((attempt * 10))
          done
          echo "Could not push after 5 attempts" && exit 1
