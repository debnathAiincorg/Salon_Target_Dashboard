# Gold Rate Trends chart (data in gold-asset-value-matching/gold-rate-data.json).
#
# Runs whenever Power Automate starts the Salon update (every 15 minutes), every day at
# 10:30 IST as a backup, or with the "Run workflow" button. Only the first run of each
# day (India time) calls GoldAPI; later runs that day find today's rate already saved. fetch_gold_rate.py
# reads the 24K / 22K / 18K gold rate in INR per gram from GoldAPI.io (needs the
# secret GOLDAPI_KEY) and adds today's point; the first run also fills in the last
# 30 days. The data file is committed; GitHub Pages republishes the site by itself.

name: Update Gold Rate

on:
  # The Salon trigger Power Automate sends every 15 minutes; fetch_gold_rate.py calls
  # GoldAPI only once a day, so the free plan's 150 requests a month are enough
  repository_dispatch:
    types: [update-dashboard]
  schedule:
    # 0 5 * * * (UTC) = 10:30 IST every day
    - cron: "0 5 * * *"
  workflow_dispatch:

concurrency:
  group: gold-rate
  cancel-in-progress: false

permissions:
  contents: write

defaults:
  run:
    working-directory: gold-asset-value-matching

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Fetch today's gold rate
        env:
          GOLDAPI_KEY: ${{ secrets.GOLDAPI_KEY }}
        run: python fetch_gold_rate.py

      - name: Commit and push the data file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gold-rate-data.json
          if git diff --cached --quiet; then
            echo "No change to the gold rate data, skipping commit"
            exit 0
          fi
          git commit -m "chore: update gold rate data via GitHub Actions"
          # The Salon and Claude API workflows push to the same branch: pull their commits first
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((attempt * 10))
          done
          echo "Could not push after 5 attempts" && exit 1
