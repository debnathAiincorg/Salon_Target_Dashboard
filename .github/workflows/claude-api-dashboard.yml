# Claude API dashboard (files in claude-api-dashboard/).
#
# Started by Power Automate (GitHub connector: "Create a repository dispatch event",
# Event Name = fetch-balance, repository = Salon_Target_Dashboard) or by the
# "Run workflow" button.
#
# Everything runs on GitHub's computers (your laptop is NOT used):
#   1. fetch_billing.py and fetch_cost.py sign in with the session from the secret
#      BILLING_STORAGE_STATE and save billing_data.json + cost_data.json
#   2. the data files are committed; GitHub Pages republishes the site by itself

name: Update Claude API Dashboard

on:
  repository_dispatch:
    types: [fetch-balance]
  workflow_dispatch:

concurrency:
  group: claude-api-dashboard
  cancel-in-progress: false

permissions:
  contents: write

defaults:
  run:
    working-directory: claude-api-dashboard

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Playwright + browser
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Run fetch_billing.py
        env:
          BILLING_STORAGE_STATE: ${{ secrets.BILLING_STORAGE_STATE }}
        run: python fetch_billing.py

      - name: Run fetch_cost.py
        env:
          BILLING_STORAGE_STATE: ${{ secrets.BILLING_STORAGE_STATE }}
        run: python fetch_cost.py

      - name: Commit and push the data files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add billing_data.json cost_data.json
          if git diff --staged --quiet; then
            echo "No changes to the Claude API data, skipping commit"
            exit 0
          fi
          git commit -m "chore: update Claude API dashboard data via GitHub Actions"
          # The Salon workflow pushes to the same branch: pull its commits first
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((attempt * 10))
          done
          echo "Could not push after 5 attempts" && exit 1
