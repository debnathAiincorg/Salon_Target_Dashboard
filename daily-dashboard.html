<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sales Dashboard</title>

    <!-- Chart.js library (defer: downloads in parallel without blocking the first paint) -->
    <script defer src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.js"></script>
    <!-- Chart.js Data Labels Plugin -->
    <script defer src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            overflow: hidden;  /* The dashboard always fits the screen; no scroll bars */
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
            background-color: #fff;
            font-size: 16px;
        }

        /* App shell: nav bar on top, sidebar on the left, status bar at the bottom */
        .app {
            height: 100vh;
            height: 100dvh;  /* Phones: excludes the browser address bar */
            display: grid;
            grid-template-columns: 48px 1fr;
            grid-template-rows: 44px 1fr 24px;
            grid-template-areas:
                "navbar  navbar"
                "sidebar main"
                "statusbar statusbar";
        }

        .navbar {
            grid-area: navbar;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding: 0 24px;
            border-bottom: 1px solid #e0e0e0;
        }

        .sidebar {
            grid-area: sidebar;
            border-right: 1px solid #e0e0e0;
        }

        .statusbar {
            grid-area: statusbar;
            border-top: 1px solid #e0e0e0;
        }

        /* Charts share the space left between the bars */
        .main {
            grid-area: main;
            min-width: 0;
            min-height: 0;
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding: 16px 24px;
        }

        /* Top row: Yearly + Monthly side by side, same height as the weekly chart */
        .chart-row {
            flex: 1;
            min-height: 0;
            display: flex;
            gap: 12px;
        }

        .chart-card {
            flex: 1;
            min-width: 0;
            min-height: 0;
            display: flex;
            flex-direction: column;
            background-color: #fff;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 10px 16px;
        }

        /* Header: stats on the left, heading in the middle */
        .chart-header {
            display: grid;
            /* Stats column never narrower than its text, so each stat stays on one line */
            grid-template-columns: minmax(max-content, 1fr) auto 1fr;
            align-items: start;
            gap: 12px;
            margin-bottom: 4px;
        }

        .chart-stats {
            grid-column: 1;
            grid-row: 1;
            font-size: 13px;
            line-height: 1.4;
            color: #555;
            white-space: nowrap;
        }

        .chart-stats b {
            color: #000;
        }

        .chart-title {
            grid-column: 2;
            grid-row: 1;
            font-size: 18px;
            font-weight: 700;
            color: #222;
            text-align: center;
            white-space: nowrap;
        }

        .chart-container {
            position: relative;
            flex: 1;
            min-height: 0;
            width: 100%;
        }

        canvas {
            max-width: 100%;
        }

        /* Data status light, right side of the nav bar: one flashing light, green or red */
        .update-status {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 4px 12px;
            border: 1px solid currentColor;
            border-radius: 999px;
            background-color: #fff;
            font-size: 13px;
            font-weight: 700;
            white-space: nowrap;
        }

        .update-status.updated {
            color: #1e9e4a;  /* green */
        }

        .update-status.pending {
            color: #e03131;  /* red */
        }

        .status-light {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background-color: currentColor;
            box-shadow: 0 0 6px currentColor;
            animation: status-flash 1s ease-in-out infinite;
        }

        @keyframes status-flash {
            50% {
                opacity: 0.15;
                box-shadow: none;
            }
        }

        /* Tablet/phone: the three charts stack, still sharing the screen height */
        @media (max-width: 1100px) {
            .main {
                gap: 8px;
                padding: 10px 12px;
            }

            .chart-row {
                flex: 2;
                flex-direction: column;
                gap: 8px;
            }

            .chart-card {
                padding: 6px 10px;
            }

            .navbar {
                padding: 0 12px;
            }
        }

        /* Short, wide screens (e.g. phone in landscape): all three charts side by side */
        @media (max-height: 500px) and (min-width: 601px) {
            .main {
                flex-direction: row;
            }

            .chart-row {
                flex: 2;
                flex-direction: row;
            }

            .chart-header {
                grid-template-columns: 1fr;
                gap: 0;
            }

            .chart-title {
                grid-column: 1;
                font-size: 14px;
            }

            .chart-stats {
                grid-row: 2;
                font-size: 11px;
                line-height: 1.3;
                text-align: center;
            }
        }

        /* Narrow cards: heading on top, stats as one wrapping line under it */
        @media (max-width: 600px) {
            .chart-header {
                grid-template-columns: 1fr;
                gap: 0;
            }

            .chart-title {
                grid-column: 1;
                font-size: 14px;
            }

            .chart-stats {
                grid-row: 2;
                display: flex;
                flex-wrap: wrap;
                justify-content: center;
                gap: 0 10px;
                font-size: 11px;
                line-height: 1.3;
            }

            .update-status {
                gap: 5px;
                padding: 3px 8px;
                font-size: 10px;
            }

            .status-light {
                width: 9px;
                height: 9px;
            }
        }
    </style>
</head>
<body>
<div class="app">
    <header class="navbar">
        <!-- Data status: green "Updated" or red "Update Pending" (see renderUpdateStatus) -->
        <div class="update-status" id="update-status" role="status" hidden>
            <span class="status-light"></span>
            <span id="update-status-text"></span>
        </div>
    </header>

    <nav class="sidebar"></nav>

    <main class="main">
        <!-- Top row: Yearly + Monthly charts side by side -->
        <div class="chart-row">
            <!-- Yearly Chart Section -->
            <div class="chart-card">
                <div class="chart-header">
                    <div class="chart-stats" id="yearly-stats"></div>
                    <div class="chart-title" id="yearly-chart-title">Yearly Sales: -</div>
                </div>
                <div class="chart-container">
                    <canvas id="yearly-sales-chart"></canvas>
                </div>
            </div>

            <!-- Daily Chart Section -->
            <div class="chart-card">
                <div class="chart-header">
                    <div class="chart-stats" id="daily-stats"></div>
                    <div class="chart-title" id="chart-title">Monthly Sales: -</div>
                </div>
                <div class="chart-container">
                    <canvas id="daily-sales-chart"></canvas>
                </div>
            </div>
        </div>

        <!-- Weekly Chart Section -->
        <div class="chart-card">
            <div class="chart-header">
                <div class="chart-stats" id="weekly-stats"></div>
                <div class="chart-title" id="weekly-chart-title">Weekly Sales: -</div>
            </div>
            <div class="chart-container">
                <canvas id="weekly-sales-chart"></canvas>
            </div>
        </div>
    </main>

    <footer class="statusbar"></footer>
</div>

    <script>
        // Constants
        const AUTO_REFRESH_INTERVAL_MS = 30000;  // 30 seconds
        const CHART_DATA_URL = "daily-dashboard-data.json";
        const YEARLY_DATA_URL = "monthly-dashboard-data.json";
        const BAR_COLOR = '#1ca0f2';
        const VALUE_COLOR = '#000';
        const REFERENCE_LINE_COLOR = '#f17777';
        const ABOVE_TARGET_COLOR = '#1e9e4a';  // green
        const BELOW_TARGET_COLOR = '#e03131';  // red
        const IST_OFFSET_MS = 5.5 * 60 * 60 * 1000;  // India has no daylight saving
        const UPDATE_DUE_HOUR_IST = 0;  // From midnight (a new day) the data counts as pending until the next refresh
        const MONTH_NAMES = ['January', 'February', 'March', 'April', 'May', 'June', 'July',
                             'August', 'September', 'October', 'November', 'December'];

        let dailyChart = null;
        let weeklyChart = null;
        let yearlyChart = null;
        let lastDataString = null;  // For change detection
        let lastData = null;  // Last data rendered, for re-checking the update status

        /**
         * Format a number with thousands separators.
         * Example: 17629 -> "17,629"
         */
        function formatNumber(num) {
            if (typeof num !== 'number') {
                return String(num);
            }
            return Math.floor(num).toLocaleString('en-US');
        }

        /**
         * Fill a chart's stats block with "Label: value" lines.
         * Values are numbers (formatted) or strings (shown as-is).
         */
        function renderStats(elementId, stats) {
            const element = document.getElementById(elementId);
            element.innerHTML = '';
            for (const [label, value] of stats) {
                const line = document.createElement('div');
                const strong = document.createElement('b');
                strong.textContent = typeof value === 'number' ? formatNumber(value) : value;
                line.append(`${label}: `, strong);
                element.appendChild(line);
            }
        }

        /**
         * A value from the data file, or '-' if this data file does not have it yet.
         * All headings, totals and averages are computed by the Python scripts at each
         * data refresh, so they only change when the data does.
         */
        function valueOrDash(value) {
            return value != null ? value : '-';
        }

        /**
         * Fetch a JSON data file with cache-busting.
         */
        async function loadJson(dataUrl) {
            try {
                const url = `${dataUrl}?t=${Date.now()}`;
                const response = await fetch(url, { cache: 'no-store' });
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const data = await response.json();
                return data;
            } catch (error) {
                console.error(`Failed to load ${dataUrl}:`, error);
                return null;
            }
        }

        /**
         * Fetch daily and yearly dashboard data.
         * Returns null only if both files fail to load.
         */
        async function loadDashboardData() {
            const [daily, yearly] = await Promise.all([loadJson(CHART_DATA_URL), loadJson(YEARLY_DATA_URL)]);
            return daily || yearly ? { daily, yearly } : null;
        }

        /**
         * Horizontal space available per bar, in pixels.
         */
        function barWidth(chart) {
            return chart.chartArea ? chart.chartArea.width / chart.data.labels.length : chart.width;
        }

        /**
         * Create a bar chart with value labels above each bar.
         * extraDatasets are drawn on top of the bars (e.g. a target line).
         * secondLabels, if given, adds a signed difference under the main label of each bar:
         * "+1,348" in green or "-10,492" in red (hidden when bars are too thin to fit two labels).
         */
        function createBarChart(canvasId, labels, values, { showXLabels, suggestedMax, extraDatasets = [], secondLabels = null, valueColor = VALUE_COLOR }) {
            const ctx = document.getElementById(canvasId).getContext('2d');
            const isThin = chart => barWidth(chart) < 40;
            const showSecond = chart => secondLabels !== null && !isThin(chart);

            const dataLabels = {
                value: {
                    color: valueColor,
                    // Sits above the second label when that is shown
                    offset: function(context) {
                        return showSecond(context.chart) ? 20 : 2;
                    },
                    // Shrink labels on narrow charts; turn them vertical when bars are thin
                    rotation: function(context) {
                        return isThin(context.chart) ? -90 : 0;
                    },
                    font: function(context) {
                        const width = barWidth(context.chart);
                        return {
                            weight: 'bold',
                            size: width < 40 ? 10 : width < 60 ? 13 : 16,
                        };
                    },
                    formatter: function(value) {
                        return value.toLocaleString('en-US');
                    }
                }
            };

            if (secondLabels !== null) {
                dataLabels.second = {
                    color: function(context) {
                        return secondLabels[context.dataIndex] >= 0 ? ABOVE_TARGET_COLOR : BELOW_TARGET_COLOR;
                    },
                    offset: 2,
                    // Bars only, not extra datasets such as the target line
                    display: function(context) {
                        return context.dataset.type !== 'line' && showSecond(context.chart);
                    },
                    font: function(context) {
                        return { weight: 'bold', size: barWidth(context.chart) < 60 ? 11 : 13 };
                    },
                    formatter: function(value, context) {
                        const diff = secondLabels[context.dataIndex];
                        return (diff >= 0 ? '+' : '-') + Math.abs(diff).toLocaleString('en-US');
                    }
                };
            }

            return new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [
                        ...extraDatasets,
                        {
                            label: 'Sales',
                            data: values,
                            backgroundColor: BAR_COLOR,
                            borderColor: BAR_COLOR,
                            borderWidth: 0,
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    // Draw at once instead of a 1s grow animation on every load and refresh
                    animation: false,
                    indexAxis: 'x',
                    layout: {
                        // Room for the value labels above the tallest bar
                        padding: { top: secondLabels !== null ? 40 : 24 }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            suggestedMax: suggestedMax,
                            // 10% headroom so the tallest bar never touches the top
                            grace: '10%',
                            ticks: {
                                maxTicksLimit: 5,
                                callback: function(value) {
                                    return value.toLocaleString('en-US');
                                }
                            },
                            grid: {
                                drawBorder: true,
                                color: 'rgba(0, 0, 0, 0.1)',
                                lineWidth: 1,
                            }
                        },
                        x: {
                            ticks: {
                                display: showXLabels,
                                maxRotation: 0,
                                // Skips some labels only when they would overlap (e.g. phones)
                                autoSkip: true,
                                font: function(context) {
                                    return { size: barWidth(context.chart) < 60 ? 10 : 12 };
                                }
                            },
                            grid: {
                                display: false,
                            }
                        }
                    },
                    plugins: {
                        legend: {
                            display: false
                        },
                        datalabels: {
                            anchor: 'end',
                            align: 'end',
                            // Keeps labels readable where the target line crosses them
                            backgroundColor: 'rgba(255, 255, 255, 0.85)',
                            padding: { top: 1, bottom: 1, left: 3, right: 3 },
                            labels: dataLabels
                        }
                    }
                },
                plugins: [ChartDataLabels]
            });
        }

        /**
         * Dashed horizontal line at a reference value (e.g. a target).
         */
        function referenceLine(label, value, count) {
            return {
                type: 'line',
                label: label,
                data: new Array(count).fill(value),
                borderColor: REFERENCE_LINE_COLOR,
                borderWidth: 2,
                borderDash: [6, 4],
                pointRadius: 0,
                datalabels: { display: false },
            };
        }

        /**
         * Render daily bar chart: heading "Monthly Sales: November 2026", monthly total,
         * and current and previous month daily averages.
         */
        function renderDailyChart(data) {
            // Destroy existing chart if it exists, so stale data never lingers on screen
            if (dailyChart) {
                dailyChart.destroy();
                dailyChart = null;
            }

            document.getElementById('chart-title').textContent =
                `Monthly Sales: ${valueOrDash(data && data.month_label)}`;

            if (!data) {
                renderStats('daily-stats', []);
                return;
            }

            renderStats('daily-stats', [
                ['Monthly Total Sales', valueOrDash(data.monthly_sales)],
                ['Current Month Daily Average Sales', valueOrDash(data.current_month_daily_average)],
                ['Previous Month Daily Average Sales', valueOrDash(data.previous_month_daily_average)],
            ]);

            if (!data.daily_chart_data || data.daily_chart_data.length === 0) {
                console.log('No daily chart data to render');
                return;
            }

            // Day of the month under each bar, e.g. "November 3" -> "3"
            const days = data.daily_chart_data.map(d => d.date.split(' ').pop());
            const sales = data.daily_chart_data.map(d => d.daily_sales);

            dailyChart = createBarChart('daily-sales-chart', days, sales, {
                showXLabels: true,
            });
        }

        /**
         * Render weekly bar chart: each bar shows its sales and the difference from
         * the weekly target, with a dashed target line.
         */
        function renderWeeklyChart(data) {
            if (weeklyChart) {
                weeklyChart.destroy();
                weeklyChart = null;
            }

            document.getElementById('weekly-chart-title').textContent =
                `Weekly Sales: ${valueOrDash(data && data.week_number)}`;

            if (!data) {
                renderStats('weekly-stats', []);
                return;
            }

            renderStats('weekly-stats', [
                ['Remaining Days', valueOrDash(data.remaining_days)],
                ['Current Week Daily Average Sales', valueOrDash(data.current_week_daily_average)],
                ['Previous Week Daily Average Sales', valueOrDash(data.previous_week_daily_average)],
            ]);

            if (!data.weekly_chart_data || data.weekly_chart_data.length === 0) {
                console.log('No weekly chart data to render');
                return;
            }

            // Two-line labels, e.g. "28 Sep - 4 Oct" -> ["28 Sep -", "4 Oct"], so they fit on phones
            const weeks = data.weekly_chart_data.map(d => d.week.replace(' - ', ' -\n').split('\n'));
            const sales = data.weekly_chart_data.map(d => d.weekly_sales);
            const target = data.weekly_target;
            // Sales minus target: positive = above target, negative = still short
            const balances = sales.map(s => s - (target || 0));

            weeklyChart = createBarChart('weekly-sales-chart', weeks, sales, {
                showXLabels: true,
                // Keep the target line in view even when every week is below it
                suggestedMax: target,
                extraDatasets: target ? [referenceLine('Target', target, weeks.length)] : [],
                secondLabels: target ? balances : null,
            });
        }

        /**
         * Render yearly bar chart: total sales for each month of the year, each bar
         * showing its difference from the monthly target, with a dashed target line.
         */
        function renderYearlyChart(data) {
            if (yearlyChart) {
                yearlyChart.destroy();
                yearlyChart = null;
            }

            document.getElementById('yearly-chart-title').textContent =
                `Yearly Sales: ${valueOrDash(data && data.year)}`;

            if (!data) {
                renderStats('yearly-stats', []);
                return;
            }

            renderStats('yearly-stats', [
                ['Year Total Sales', valueOrDash(data.year_total_sales)],
                ['Average Monthly Sales', valueOrDash(data.average_monthly_sales)],
                ['Current Year Daily Average Sales', valueOrDash(data.year_daily_average)],
            ]);

            if (!data.monthly_chart_data || data.monthly_chart_data.length === 0) {
                console.log('No yearly chart data to render');
                return;
            }

            // Short month names, e.g. "January" -> "Jan", so 12 months fit in half the width
            const months = data.monthly_chart_data.map(m => m.month.slice(0, 3));
            const sales = data.monthly_chart_data.map(m => m.total_sales);
            const target = data.monthly_target;
            // Sales minus target: positive = above target, negative = still short
            const differences = sales.map(s => s - (target || 0));

            yearlyChart = createBarChart('yearly-sales-chart', months, sales, {
                showXLabels: true,
                // Keep the target line in view even when every month is below it
                suggestedMax: target,
                extraDatasets: target ? [referenceLine('Target', target, months.length)] : [],
                secondLabels: target ? differences : null,
            });
        }

        /**
         * Parse a "last_updated" value written by format_ist_timestamp() in the Python
         * scripts, e.g. "3 November 2026, 11:54 AM IST", into a UTC timestamp (ms).
         * Returns null if the text is missing or not in that format.
         */
        function parseIstTimestamp(text) {
            const match = /^(\d{1,2}) ([A-Za-z]+) (\d{4}), (\d{1,2}):(\d{2}) (AM|PM) IST$/.exec(text || '');
            if (!match) {
                return null;
            }
            const [, day, monthName, year, hour12, minute, meridiem] = match;
            const month = MONTH_NAMES.indexOf(monthName);
            if (month === -1) {
                return null;
            }
            const hour = (Number(hour12) % 12) + (meridiem === 'PM' ? 12 : 0);
            return Date.UTC(Number(year), month, Number(day), hour, Number(minute)) - IST_OFFSET_MS;
        }

        /**
         * The most recent UPDATE_DUE_HOUR_IST (midnight IST) at or before now, as a UTC timestamp (ms).
         */
        function lastUpdateDueTime() {
            // Shifting by the offset lets the UTC getters read IST wall-clock values
            const nowIst = new Date(Date.now() + IST_OFFSET_MS);
            const dayOffset = nowIst.getUTCHours() >= UPDATE_DUE_HOUR_IST ? 0 : -1;
            return Date.UTC(
                nowIst.getUTCFullYear(), nowIst.getUTCMonth(), nowIst.getUTCDate() + dayOffset, UPDATE_DUE_HOUR_IST
            ) - IST_OFFSET_MS;
        }

        /**
         * Show the status light: green "Updated" when the data was refreshed today (IST),
         * red "Update Pending" from midnight until the next data refresh.
         */
        function renderUpdateStatus(data) {
            const status = document.getElementById('update-status');
            const lastUpdatedText = data && data.daily && data.daily.last_updated;
            const lastUpdated = parseIstTimestamp(lastUpdatedText);
            const isUpdated = lastUpdated !== null && lastUpdated >= lastUpdateDueTime();

            status.className = `update-status ${isUpdated ? 'updated' : 'pending'}`;
            document.getElementById('update-status-text').textContent = isUpdated ? 'Updated' : 'Update Pending';
            status.title = `Last updated: ${lastUpdatedText || '-'}`;
            status.hidden = false;
        }

        /**
         * Main render function: update all charts.
         */
        function render(data) {
            renderYearlyChart(data.yearly);
            renderWeeklyChart(data.daily);
            renderDailyChart(data.daily);
            renderUpdateStatus(data);
            lastData = data;
        }

        // Start fetching data now, while the deferred chart libraries are still downloading
        const initialDataPromise = loadDashboardData();

        /**
         * Initialize the dashboard and set up auto-refresh.
         */
        async function init() {
            console.log('Initializing dashboard...');

            // Initial load
            const data = await initialDataPromise;
            if (data) {
                render(data);
                lastDataString = JSON.stringify(data);
            } else {
                renderUpdateStatus(null);  // No data could be loaded: show pending
            }

            // Set up auto-refresh
            setInterval(async () => {
                // Turns the light red at midnight even when the data has not changed
                renderUpdateStatus(lastData);

                // No polling while the tab is in the background
                if (document.hidden) {
                    return;
                }
                const freshData = await loadDashboardData();
                if (freshData) {
                    const freshDataString = JSON.stringify(freshData);
                    if (freshDataString !== lastDataString) {
                        console.log('Dashboard data changed, updating...');
                        render(freshData);
                        lastDataString = freshDataString;
                    }
                }
            }, AUTO_REFRESH_INTERVAL_MS);
        }

        // Start when DOM is ready
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    </script>
</body>
</html>
