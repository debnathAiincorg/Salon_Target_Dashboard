<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sales Dashboard</title>

    <!-- Chart.js library (defer: downloads in parallel without blocking the first paint) -->
    <script defer src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.js"></script>
    <!-- Chart.js Data Labels Plugin -->
    <script defer src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            overflow: hidden;  /* The dashboard always fits the screen; no scroll bars */
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
            background-color: #fff;
            font-size: 16px;
        }

        /* App shell: nav bar on top, sidebar on the left, status bar at the bottom */
        .app {
            height: 100vh;
            height: 100dvh;  /* Phones: excludes the browser address bar */
            display: grid;
            /* minmax(0, ...): long content can never make the page wider than the screen */
            grid-template-columns: 48px minmax(0, 1fr);
            grid-template-rows: 44px 1fr 32px;
            grid-template-areas:
                "navbar  navbar"
                "sidebar main"
                "statusbar statusbar";
        }

        .navbar {
            grid-area: navbar;
            min-width: 0;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 12px;
            padding: 0 24px;
            border-bottom: 1px solid #b5dbf6;
            background-color: #d4eafb;  /* soft tint of the chart blue */
        }

        .sidebar {
            grid-area: sidebar;
            border-right: 1px solid #b5dbf6;
            background-color: #d4eafb;
        }

        /* Status bar: rotation controls (play/pause toggle, chart tabs, progress line) */
        .statusbar {
            grid-area: statusbar;
            position: relative;
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
            padding: 0 12px;
            border-top: 1px solid #b5dbf6;
            background-color: #d4eafb;
        }

        /* One button that switches between Play and Pause */
        .rotation-toggle {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            height: 24px;
            padding: 0 12px 0 10px;
            border: 1px solid #1ca0f2;
            border-radius: 999px;
            background-color: #fff;
            color: #0b6aa8;
            font: inherit;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
        }

        .rotation-toggle:hover {
            background-color: #eef7fe;
        }

        .rotation-toggle:focus-visible,
        .slide-tab:focus-visible {
            outline: 2px solid #0b6aa8;
            outline-offset: 2px;
        }

        .rotation-toggle svg {
            width: 10px;
            height: 10px;
            fill: currentColor;
        }

        /* Only the icon for the current state is shown */
        .rotation-toggle .icon-play,
        .rotation-toggle.is-paused .icon-pause {
            display: none;
        }

        .rotation-toggle.is-paused .icon-play {
            display: block;
        }

        /* Tabs grouped by dashboard; scroll sideways if the screen is too narrow for all */
        .slide-tabs {
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 0;
            overflow-x: auto;
            scrollbar-width: none;
        }

        .slide-tabs::-webkit-scrollbar {
            display: none;
        }

        .tab-group {
            display: flex;
            flex-shrink: 0;
            align-items: center;
            gap: 2px;
        }

        .tab-group + .tab-group {
            padding-left: 8px;
            border-left: 1px solid #a9d1ef;
        }

        .tab-group-label {
            margin-right: 4px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.03em;
            text-transform: uppercase;
            color: #0b4f7a;
            white-space: nowrap;
        }

        .slide-tab {
            white-space: nowrap;
        }

        .slide-tab {
            height: 22px;
            padding: 0 10px;
            border: 0;
            border-radius: 999px;
            background: transparent;
            color: #3d5a73;
            font: inherit;
            font-size: 12px;
            cursor: pointer;
        }

        .slide-tab:hover {
            background-color: rgba(255, 255, 255, 0.6);
        }

        .slide-tab[aria-current="true"] {
            background-color: #fff;
            color: #000;
            font-weight: 700;
        }

        .rotation-note {
            margin-left: auto;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-size: 12px;
            color: #3d5a73;
        }

        /* Thin line along the top of the status bar: time left until the next chart */
        .rotation-progress {
            position: absolute;
            top: -1px;
            left: 0;
            width: 0;
            height: 2px;
            background-color: #1ca0f2;
        }

        /* One chart at a time fills the space between the bars; all three sit in the same
           grid cell, so hidden charts keep their size and switching never resizes them */
        .main {
            grid-area: main;
            min-width: 0;
            min-height: 0;
            display: grid;
            grid-template: minmax(0, 1fr) / minmax(0, 1fr);
            --main-pad-y: 16px;
            --main-pad-x: 24px;
            padding: var(--main-pad-y) var(--main-pad-x);
        }

        .chart-card {
            grid-area: 1 / 1;
            min-width: 0;
            min-height: 0;
            display: flex;
            flex-direction: column;
            background-color: #fff;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 10px 16px;
            opacity: 0;
            visibility: hidden;
            /* Fade out, then hide once the fade has finished */
            transition: opacity 0.45s ease, visibility 0s linear 0.45s;
        }

        .chart-card.active {
            opacity: 1;
            visibility: visible;
            transition: opacity 0.45s ease, visibility 0s;
        }

        @media (prefers-reduced-motion: reduce) {
            .chart-card,
            .chart-card.active {
                transition: none;
            }
        }

        /* Pages of the Claude API dashboard, shown inside the rotation.
           They fill the whole space between the bars, with no gap or frame around them. */
        .chart-card.embed-card {
            margin: calc(-1 * var(--main-pad-y)) calc(-1 * var(--main-pad-x));
            padding: 0;
            border: 0;
            border-radius: 0;
            overflow: hidden;
        }

        .embed-card iframe {
            display: block;
            flex: 1;
            width: 100%;
            min-height: 0;
            border: 0;
        }

        /* Left of the nav bar: the dashboard and page on screen */
        .dashboard-name {
            margin-right: auto;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-size: 15px;
            font-weight: 700;
            color: #0b4f7a;
        }

        /* Hidden when the page on screen has no status to show (see renderNavStatus) */
        .last-updated[hidden],
        .update-status[hidden] {
            display: none;
        }

        /* Header: heading centred on top, then a row of three KPI cards */
        .chart-header {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 8px;
        }

        .chart-title {
            order: 1;
            font-size: 18px;
            font-weight: 700;
            color: #222;
            text-align: center;
            white-space: nowrap;
        }

        .chart-stats {
            order: 2;
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 12px;
        }

        .kpi-card {
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 2px;
            padding: 8px 14px;
            background-color: #f5fafe;
            border: 1px solid #d6e9f8;
            border-left: 4px solid #1ca0f2;  /* chart blue */
            border-radius: 8px;
        }

        .kpi-label {
            font-size: 12px;
            color: #555;
            /* One line; cut with "..." only if the card is too narrow */
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .kpi-value {
            font-size: 22px;
            font-weight: 700;
            line-height: 1.2;
            color: #000;
        }

        /* Gold Rate Trends: variant buttons (All / 18K / 22K / 24K) and source note */
        .gold-variants {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 8px;
        }

        .gold-variant {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 7px 16px;
            border: 1px solid #dcdcdc;
            border-radius: 999px;
            background-color: #fff;
            color: #5c1a1a;
            font: inherit;
            font-size: 13px;
            cursor: pointer;
        }

        .gold-variant:hover {
            border-color: #c98c86;
        }

        .gold-variant[aria-pressed="true"] {
            background-color: #fbe9e7;
            border-color: #c98c86;
        }

        .gold-variant:focus-visible {
            outline: 2px solid #0b6aa8;
            outline-offset: 2px;
        }

        .variant-dot {
            width: 11px;
            height: 11px;
            border-radius: 50%;
        }

        /* Gold chart before its first data update */
        .chart-container.chart-empty::after {
            content: "Waiting for the first gold rate update...";
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #888;
            font-size: 14px;
        }

        .gold-note {
            margin-top: 4px;
            font-size: 11px;
            color: #888;
            text-align: right;
        }

        .chart-container {
            position: relative;
            flex: 1;
            min-height: 0;
            width: 100%;
        }

        canvas {
            max-width: 100%;
        }

        /* Shown in place of a chart that could not be drawn (see render) */
        .chart-container.chart-error::after {
            content: "Chart could not load. Retrying automatically...";
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #888;
            font-size: 14px;
        }

        /* Data status light, right side of the nav bar: one flashing light, green or red */
        .update-status {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 4px 12px;
            border: 1px solid currentColor;
            border-radius: 999px;
            background-color: #fff;
            font-size: 13px;
            font-weight: 700;
            white-space: nowrap;
        }

        .last-updated {
            min-width: 0;
            font-size: 13px;
            color: #555;
            white-space: nowrap;
            /* On narrow phones the text is cut with "..." instead of widening the page */
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .last-updated b {
            color: #000;
        }

        .update-status.updated {
            color: #1e9e4a;  /* green */
        }

        .update-status.pending {
            color: #e03131;  /* red */
        }

        .status-light {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background-color: currentColor;
            box-shadow: 0 0 6px currentColor;
            animation: status-flash 1s ease-in-out infinite;
        }

        @keyframes status-flash {
            50% {
                opacity: 0.15;
                box-shadow: none;
            }
        }

        /* Tablet/phone: tighter spacing */
        @media (max-width: 1100px) {
            .main {
                --main-pad-y: 10px;
                --main-pad-x: 12px;
            }

            .chart-card {
                padding: 6px 10px;
            }

            .navbar {
                padding: 0 12px;
            }
        }

        /* Short, wide screens (e.g. phone in landscape): compact header and KPI cards */
        @media (max-height: 500px) and (min-width: 601px) {
            .chart-header {
                gap: 4px;
                margin-bottom: 4px;
            }

            .chart-title {
                font-size: 14px;
            }

            .chart-stats {
                gap: 8px;
            }

            .kpi-card {
                padding: 3px 8px;
            }

            .kpi-label {
                font-size: 10px;
            }

            .kpi-value {
                font-size: 14px;
            }
        }

        /* Phones: smaller KPI cards; long labels may wrap onto two lines */
        @media (max-width: 600px) {
            .chart-header {
                gap: 6px;
                margin-bottom: 6px;
            }

            .chart-title {
                font-size: 14px;
            }

            .chart-stats {
                gap: 6px;
            }

            .kpi-card {
                padding: 5px 7px;
                border-left-width: 3px;
            }

            .kpi-label {
                font-size: 10px;
                line-height: 1.25;
                white-space: normal;
            }

            .kpi-value {
                font-size: 15px;
            }

            .last-updated {
                font-size: 10px;
            }

            .update-status {
                gap: 5px;
                padding: 3px 8px;
                font-size: 10px;
            }

            .status-light {
                width: 9px;
                height: 9px;
            }

            .statusbar {
                gap: 8px;
                padding: 0 8px;
            }

            .slide-tab {
                padding: 0 7px;
                font-size: 11px;
            }

            .rotation-note,
            .tab-group-label {
                display: none;
            }

            .dashboard-name {
                font-size: 12px;
            }
        }
    </style>
</head>
<body>
<div class="app">
    <header class="navbar">
        <!-- Which dashboard and page is on screen, e.g. "Salon · Monthly" (see showSlide) -->
        <div class="dashboard-name" id="dashboard-name"></div>
        <!-- Salon data status: last update time, then green "Updated" or red "Not Updated" (see renderUpdateStatus).
             Shown only on the Salon charts; the other dashboards show their own status. -->
        <div class="last-updated" id="last-updated" hidden>
            <span id="last-updated-label">Last updated</span> (Indian time): <b id="last-updated-text"></b><span id="last-updated-extra"></span>
        </div>
        <div class="update-status" id="update-status" role="status" hidden>
            <span class="status-light"></span>
            <span id="update-status-text"></span>
        </div>
    </header>

    <nav class="sidebar"></nav>

    <!-- Pages rotate full screen in this order (see the rotation code):
         Salon: Monthly, Weekly, Yearly -> Claude API: Balance, Daily usage, Monthly usage
         -> Gold: Rate trends -->
    <main class="main">
        <!-- Daily Chart Section (shown first) -->
        <section class="chart-card active" data-group="Salon" data-slide-name="Monthly">
            <div class="chart-header">
                <div class="chart-stats" id="daily-stats"></div>
                <div class="chart-title" id="chart-title">Monthly Sales: -</div>
            </div>
            <div class="chart-container">
                <canvas id="daily-sales-chart"></canvas>
            </div>
        </section>

        <!-- Weekly Chart Section -->
        <section class="chart-card" data-group="Salon" data-slide-name="Weekly" aria-hidden="true">
            <div class="chart-header">
                <div class="chart-stats" id="weekly-stats"></div>
                <div class="chart-title" id="weekly-chart-title">Weekly Sales: -</div>
            </div>
            <div class="chart-container">
                <canvas id="weekly-sales-chart"></canvas>
            </div>
        </section>

        <!-- Yearly Chart Section -->
        <section class="chart-card" data-group="Salon" data-slide-name="Yearly" aria-hidden="true">
            <div class="chart-header">
                <div class="chart-stats" id="yearly-stats"></div>
                <div class="chart-title" id="yearly-chart-title">Yearly Sales: -</div>
            </div>
            <div class="chart-container">
                <canvas id="yearly-sales-chart"></canvas>
            </div>
        </section>

        <!-- Claude API dashboard pages (files in claude-api-dashboard/, updated by their own workflow) -->
        <section class="chart-card embed-card" data-group="Claude API" data-embed="claude" data-slide-name="Balance" aria-hidden="true">
            <iframe data-src="claude-api-dashboard/billing_dashboard.html" title="Claude API credit balance"></iframe>
        </section>
        <section class="chart-card embed-card" data-group="Claude API" data-embed="claude" data-slide-name="Daily usage" aria-hidden="true">
            <iframe data-src="claude-api-dashboard/usage.html" title="Claude API daily usage"></iframe>
        </section>
        <section class="chart-card embed-card" data-group="Claude API" data-embed="claude" data-slide-name="Monthly usage" aria-hidden="true">
            <iframe data-src="claude-api-dashboard/monthly.html" title="Claude API monthly usage"></iframe>
        </section>

        <!-- Gold Rate Trends: Tanishq's rate (data: gold-asset-value-matching/gold-rate-data.json, from fetch_tanishq_rate.py via gold-rate.yml) -->
        <section class="chart-card" data-group="Gold" data-slide-name="Rate trends" aria-hidden="true">
            <div class="chart-header">
                <div class="chart-stats" id="gold-stats"></div>
                <div class="chart-title" id="gold-chart-title">Gold Rate Trends</div>
            </div>
            <div class="gold-variants" id="gold-variants" role="group" aria-label="Gold variant">
                <button type="button" class="gold-variant" data-variant="all" aria-pressed="false">All Variants</button>
                <button type="button" class="gold-variant" data-variant="18k" aria-pressed="false"><span class="variant-dot" style="background-color: #c9c418"></span>18 Karat</button>
                <button type="button" class="gold-variant" data-variant="22k" aria-pressed="true"><span class="variant-dot" style="background-color: #4e9a1f"></span>22 Karat</button>
                <button type="button" class="gold-variant" data-variant="24k" aria-pressed="false"><span class="variant-dot" style="background-color: #d0675a"></span>24 Karat</button>
            </div>
            <div class="chart-container">
                <canvas id="gold-rate-chart"></canvas>
            </div>
            <div class="gold-note">Tanishq gold rate in &#8377; per gram, as reported by Goodreturns (goodreturns.in). Solid dot: reported that day. Hollow dot: no report that day, last known rate shown.</div>
        </section>
    </main>

    <footer class="statusbar">
        <div class="rotation-progress" id="rotation-progress"></div>
        <button type="button" class="rotation-toggle" id="rotation-toggle" aria-label="Pause rotation">
            <svg class="icon-pause" viewBox="0 0 10 10" aria-hidden="true"><rect x="1" y="0" width="3" height="10"/><rect x="6" y="0" width="3" height="10"/></svg>
            <svg class="icon-play" viewBox="0 0 10 10" aria-hidden="true"><path d="M1 0 L10 5 L1 10 Z"/></svg>
            <span id="rotation-toggle-text">Pause</span>
        </button>
        <div class="slide-tabs" id="slide-tabs"></div>
        <div class="rotation-note" id="rotation-note" aria-live="polite"></div>
    </footer>
</div>

    <script>
        // Constants
        const AUTO_REFRESH_INTERVAL_MS = 30000;  // 30 seconds
        const CHART_DATA_URL = "daily-dashboard-data.json";
        const YEARLY_DATA_URL = "monthly-dashboard-data.json";
        const GOLD_DATA_URL = "gold-asset-value-matching/gold-rate-data.json";
        // Gold Rate Trends lines, in the colours of the variant buttons
        const GOLD_VARIANTS = {
            '18k': { label: '18 Karat', color: '#c9c418' },
            '22k': { label: '22 Karat', color: '#4e9a1f' },
            '24k': { label: '24 Karat', color: '#d0675a' },
        };
        const BAR_COLOR = '#1ca0f2';
        const VALUE_COLOR = '#000';
        const REFERENCE_LINE_COLOR = '#f17777';
        const ABOVE_TARGET_COLOR = '#1e9e4a';  // green
        const BELOW_TARGET_COLOR = '#e03131';  // red
        const IST_OFFSET_MS = 5.5 * 60 * 60 * 1000;  // India has no daylight saving
        const UPDATE_DUE_HOUR_IST = 0;  // From midnight (a new day) the data counts as pending until the next refresh
        const MONTH_NAMES = ['January', 'February', 'March', 'April', 'May', 'June', 'July',
                             'August', 'September', 'October', 'November', 'December'];

        let dailyChart = null;
        let weeklyChart = null;
        let yearlyChart = null;
        let goldChart = null;
        let goldVariant = '22k';  // Gold Rate Trends: 'all', '18k', '22k' or '24k'
        let lastDataString = null;  // For change detection
        let lastData = null;  // Last data rendered, for re-checking the update status

        /**
         * Format a number with thousands separators.
         * Example: 17629 -> "17,629"
         */
        function formatNumber(num) {
            if (typeof num !== 'number') {
                return String(num);
            }
            return Math.floor(num).toLocaleString('en-US');
        }

        /**
         * Fill a chart's stats block with one KPI card per [label, value] pair.
         * Values are numbers (formatted) or strings (shown as-is).
         */
        function renderStats(elementId, stats) {
            const element = document.getElementById(elementId);
            element.innerHTML = '';
            for (const [label, value] of stats) {
                const card = document.createElement('div');
                card.className = 'kpi-card';
                const labelEl = document.createElement('span');
                labelEl.className = 'kpi-label';
                labelEl.textContent = label;
                labelEl.title = label;  // Full label on hover if it is cut short
                const valueEl = document.createElement('span');
                valueEl.className = 'kpi-value';
                valueEl.textContent = typeof value === 'number' ? formatNumber(value) : value;
                card.append(labelEl, valueEl);
                element.appendChild(card);
            }
        }

        /**
         * A value from the data file, or '-' if this data file does not have it yet.
         * All headings, totals and averages are computed by the Python scripts at each
         * data refresh, so they only change when the data does.
         */
        function valueOrDash(value) {
            return value != null ? value : '-';
        }

        /**
         * Fetch a JSON data file with cache-busting.
         */
        async function loadJson(dataUrl) {
            try {
                const url = `${dataUrl}?t=${Date.now()}`;
                const response = await fetch(url, { cache: 'no-store' });
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const data = await response.json();
                return data;
            } catch (error) {
                console.error(`Failed to load ${dataUrl}:`, error);
                return null;
            }
        }

        /**
         * Fetch daily and yearly dashboard data.
         * Returns null only if both files fail to load.
         */
        async function loadDashboardData() {
            const [daily, yearly, gold] = await Promise.all(
                [loadJson(CHART_DATA_URL), loadJson(YEARLY_DATA_URL), loadJson(GOLD_DATA_URL)]);
            return daily || yearly || gold ? { daily, yearly, gold } : null;
        }

        /**
         * Horizontal space available per bar, in pixels.
         */
        function barWidth(chart) {
            return chart.chartArea ? chart.chartArea.width / chart.data.labels.length : chart.width;
        }

        /**
         * Create a bar chart with value labels above each bar.
         * extraDatasets are drawn on top of the bars (e.g. a target line).
         * secondLabels, if given, adds a signed difference under the main label of each bar:
         * "+1,348" in green or "-10,492" in red (hidden when bars are too thin to fit two labels).
         */
        function createBarChart(canvasId, labels, values, { showXLabels, suggestedMax, extraDatasets = [], secondLabels = null, valueColor = VALUE_COLOR }) {
            const ctx = document.getElementById(canvasId).getContext('2d');
            const isThin = chart => barWidth(chart) < 40;
            const showSecond = chart => secondLabels !== null && !isThin(chart);

            const dataLabels = {
                value: {
                    color: valueColor,
                    // Sits above the second label when that is shown
                    offset: function(context) {
                        return showSecond(context.chart) ? 20 : 2;
                    },
                    // Shrink labels on narrow charts; turn them vertical when bars are thin
                    rotation: function(context) {
                        return isThin(context.chart) ? -90 : 0;
                    },
                    font: function(context) {
                        const width = barWidth(context.chart);
                        return {
                            weight: 'bold',
                            size: width < 40 ? 10 : width < 60 ? 13 : 16,
                        };
                    },
                    formatter: function(value) {
                        return value.toLocaleString('en-US');
                    }
                }
            };

            if (secondLabels !== null) {
                dataLabels.second = {
                    color: function(context) {
                        return secondLabels[context.dataIndex] >= 0 ? ABOVE_TARGET_COLOR : BELOW_TARGET_COLOR;
                    },
                    offset: 2,
                    // Bars only, not extra datasets such as the target line
                    display: function(context) {
                        return context.dataset.type !== 'line' && showSecond(context.chart);
                    },
                    font: function(context) {
                        return { weight: 'bold', size: barWidth(context.chart) < 60 ? 11 : 13 };
                    },
                    formatter: function(value, context) {
                        const diff = secondLabels[context.dataIndex];
                        return (diff >= 0 ? '+' : '-') + Math.abs(diff).toLocaleString('en-US');
                    }
                };
            }

            return new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [
                        ...extraDatasets,
                        {
                            label: 'Sales',
                            data: values,
                            backgroundColor: BAR_COLOR,
                            borderColor: BAR_COLOR,
                            borderWidth: 0,
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    // Draw at once instead of a 1s grow animation on every load and refresh
                    animation: false,
                    indexAxis: 'x',
                    layout: {
                        // Room for the value labels above the tallest bar
                        padding: { top: secondLabels !== null ? 40 : 24 }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            suggestedMax: suggestedMax,
                            // 10% headroom so the tallest bar never touches the top
                            grace: '10%',
                            ticks: {
                                maxTicksLimit: 5,
                                callback: function(value) {
                                    return value.toLocaleString('en-US');
                                }
                            },
                            grid: {
                                drawBorder: true,
                                color: 'rgba(0, 0, 0, 0.1)',
                                lineWidth: 1,
                            }
                        },
                        x: {
                            ticks: {
                                display: showXLabels,
                                maxRotation: 0,
                                // Skips some labels only when they would overlap (e.g. phones)
                                autoSkip: true,
                                font: function(context) {
                                    return { size: barWidth(context.chart) < 60 ? 10 : 12 };
                                }
                            },
                            grid: {
                                display: false,
                            }
                        }
                    },
                    plugins: {
                        legend: {
                            display: false
                        },
                        datalabels: {
                            anchor: 'end',
                            align: 'end',
                            // Keeps labels readable where the target line crosses them
                            backgroundColor: 'rgba(255, 255, 255, 0.85)',
                            padding: { top: 1, bottom: 1, left: 3, right: 3 },
                            labels: dataLabels
                        }
                    }
                },
                plugins: [ChartDataLabels]
            });
        }

        /**
         * Dashed horizontal line at a reference value (e.g. a target).
         */
        function referenceLine(label, value, count) {
            return {
                type: 'line',
                label: label,
                data: new Array(count).fill(value),
                borderColor: REFERENCE_LINE_COLOR,
                borderWidth: 2,
                borderDash: [6, 4],
                pointRadius: 0,
                datalabels: { display: false },
            };
        }

        /**
         * Render daily bar chart: heading "Monthly Sales: November 2026", monthly total,
         * and current and previous month daily averages.
         */
        function renderDailyChart(data) {
            // Destroy existing chart if it exists, so stale data never lingers on screen
            if (dailyChart) {
                dailyChart.destroy();
                dailyChart = null;
            }

            document.getElementById('chart-title').textContent =
                `Monthly Sales: ${valueOrDash(data && data.month_label)}`;

            if (!data) {
                renderStats('daily-stats', []);
                return;
            }

            renderStats('daily-stats', [
                ['Monthly Total Sales', valueOrDash(data.monthly_sales)],
                ['Current Month Daily Average Sales', valueOrDash(data.current_month_daily_average)],
                ['Previous Month Daily Average Sales', valueOrDash(data.previous_month_daily_average)],
            ]);

            if (!data.daily_chart_data || data.daily_chart_data.length === 0) {
                console.log('No daily chart data to render');
                return;
            }

            // Day of the month under each bar, e.g. "November 3" -> "3"
            const days = data.daily_chart_data.map(d => d.date.split(' ').pop());
            const sales = data.daily_chart_data.map(d => d.daily_sales);

            dailyChart = createBarChart('daily-sales-chart', days, sales, {
                showXLabels: true,
            });
        }

        /**
         * Render weekly bar chart: each bar shows its sales and the difference from
         * the weekly target, with a dashed target line.
         */
        function renderWeeklyChart(data) {
            if (weeklyChart) {
                weeklyChart.destroy();
                weeklyChart = null;
            }

            document.getElementById('weekly-chart-title').textContent =
                `Weekly Sales: ${valueOrDash(data && data.week_number)}`;

            if (!data) {
                renderStats('weekly-stats', []);
                return;
            }

            renderStats('weekly-stats', [
                ['Remaining Days', valueOrDash(data.remaining_days)],
                ['Current Week Daily Average Sales', valueOrDash(data.current_week_daily_average)],
                ['Previous Week Daily Average Sales', valueOrDash(data.previous_week_daily_average)],
            ]);

            if (!data.weekly_chart_data || data.weekly_chart_data.length === 0) {
                console.log('No weekly chart data to render');
                return;
            }

            // Two-line labels, e.g. "28 Sep - 4 Oct" -> ["28 Sep -", "4 Oct"], so they fit on phones
            const weeks = data.weekly_chart_data.map(d => d.week.replace(' - ', ' -\n').split('\n'));
            const sales = data.weekly_chart_data.map(d => d.weekly_sales);
            const target = data.weekly_target;
            // Sales minus target: positive = above target, negative = still short
            const balances = sales.map(s => s - (target || 0));

            weeklyChart = createBarChart('weekly-sales-chart', weeks, sales, {
                showXLabels: true,
                // Keep the target line in view even when every week is below it
                suggestedMax: target,
                extraDatasets: target ? [referenceLine('Target', target, weeks.length)] : [],
                secondLabels: target ? balances : null,
            });
        }

        /**
         * Render yearly bar chart: total sales for each month of the year, each bar
         * showing its difference from the monthly target, with a dashed target line.
         */
        function renderYearlyChart(data) {
            if (yearlyChart) {
                yearlyChart.destroy();
                yearlyChart = null;
            }

            document.getElementById('yearly-chart-title').textContent =
                `Yearly Sales: ${valueOrDash(data && data.year)}`;

            if (!data) {
                renderStats('yearly-stats', []);
                return;
            }

            renderStats('yearly-stats', [
                ['Year Total Sales', valueOrDash(data.year_total_sales)],
                ['Average Monthly Sales', valueOrDash(data.average_monthly_sales)],
                ['Current Year Daily Average Sales', valueOrDash(data.year_daily_average)],
            ]);

            if (!data.monthly_chart_data || data.monthly_chart_data.length === 0) {
                console.log('No yearly chart data to render');
                return;
            }

            // Short month names, e.g. "January" -> "Jan", so 12 months fit on phones
            const months = data.monthly_chart_data.map(m => m.month.slice(0, 3));
            const sales = data.monthly_chart_data.map(m => m.total_sales);
            const target = data.monthly_target;
            // Sales minus target: positive = above target, negative = still short
            const differences = sales.map(s => s - (target || 0));

            yearlyChart = createBarChart('yearly-sales-chart', months, sales, {
                showXLabels: true,
                // Keep the target line in view even when every month is below it
                suggestedMax: target,
                extraDatasets: target ? [referenceLine('Target', target, months.length)] : [],
                secondLabels: target ? differences : null,
            });
        }

        /** Rupees, Indian digit grouping, no paise: 11560.4 -> "₹ 11,560" */
        function formatRupees(value) {
            return `₹ ${Math.round(value).toLocaleString('en-IN')}`;
        }

        /** "2026-10-23" -> "23 Oct" */
        function shortDate(isoDate) {
            const [year, month, day] = isoDate.split('-').map(Number);
            return `${String(day).padStart(2, '0')} ${MONTH_NAMES[month - 1].slice(0, 3)}`;
        }

        /**
         * Render the Gold Rate Trends line chart: last chart_days days of the selected variant
         * (or all three), today's rates in the KPI cards. Hovering a day shows its rate and the
         * difference from today's rate, e.g. "₹ 13,090 (+1,575↑)".
         */
        function renderGoldChart(data) {
            if (goldChart) {
                goldChart.destroy();
                goldChart = null;
            }

            const history = (data && data.history) || [];
            document.getElementById('gold-rate-chart').parentElement.classList.toggle('chart-empty', history.length === 0);
            if (history.length === 0) {
                renderStats('gold-stats', [
                    ['24 Karat (per gram)', '-'],
                    ['22 Karat (per gram)', '-'],
                    ['18 Karat (per gram)', '-'],
                ]);
                return;
            }

            // Always the last chart_days calendar days, ending today (India time). Goodreturns does
            // not report Tanishq's rate every day: a day without a report repeats the last known
            // rate and is drawn with a hollow dot ("filled in"); reported days have a solid dot.
            const byDate = new Map(history.map(p => [p.date, p]));
            const todayIst = new Date(Date.now() + IST_OFFSET_MS).toISOString().slice(0, 10);
            const chartDays = data.chart_days || 30;
            const dayKeys = [];
            for (let i = chartDays - 1; i >= 0; i--) {
                dayKeys.push(new Date(Date.parse(todayIst + 'T00:00:00Z') - i * 86400000).toISOString().slice(0, 10));
            }
            let lastKnown = null;
            for (const p of history) {  // the last report before the window starts
                if (p.date < dayKeys[0]) lastKnown = p;
            }
            const points = dayKeys.map(day => {
                if (byDate.has(day)) {
                    lastKnown = byDate.get(day);
                    return { ...lastKnown, date: day, reported: true };
                }
                return lastKnown ? { ...lastKnown, date: day, reported: false, fromDate: lastKnown.date } : null;
            });
            const latest = history[history.length - 1];  // latest real report
            renderStats('gold-stats', ['24k', '22k', '18k'].map(key =>
                // The date of the latest reported rate (not always today)
                [`${GOLD_VARIANTS[key].label} on ${shortDate(latest.date)} (per gram)`, formatRupees(latest[key])]));

            const shown = goldVariant === 'all' ? ['18k', '22k', '24k'] : [goldVariant];
            const datasets = shown.map(key => ({
                label: GOLD_VARIANTS[key].label,
                data: points.map(p => (p ? p[key] : null)),
                borderColor: GOLD_VARIANTS[key].color,
                backgroundColor: GOLD_VARIANTS[key].color,
                // Solid dot = reported that day; hollow dot = no report, last known rate
                pointBackgroundColor: points.map(p => (p && p.reported ? GOLD_VARIANTS[key].color : '#fff')),
                pointBorderColor: GOLD_VARIANTS[key].color,
                pointBorderWidth: 1.5,
                borderWidth: 2,
                pointRadius: 3,
                pointHoverRadius: 5,
                tension: 0,
                variantKey: key,
                goldPoints: points,
            }));

            const ctx = document.getElementById('gold-rate-chart').getContext('2d');
            goldChart = new Chart(ctx, {
                type: 'line',
                data: { labels: dayKeys.map(shortDate), datasets },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    animation: false,
                    layout: { padding: { top: 28, right: 24 } },
                    interaction: { mode: 'index', intersect: false },
                    scales: {
                        y: {
                            grace: '5%',
                            ticks: {
                                maxTicksLimit: 8,
                                callback: value => Math.round(value).toLocaleString('en-IN'),
                            },
                            grid: { color: 'rgba(0, 0, 0, 0.08)' },
                        },
                        x: {
                            ticks: { maxRotation: 0, autoSkip: true, autoSkipPadding: 12 },
                            grid: { display: false },
                        },
                    },
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            backgroundColor: '#fff',
                            titleColor: '#333',
                            bodyColor: '#333',
                            borderColor: '#ddd',
                            borderWidth: 1,
                            padding: 12,
                            boxPadding: 4,
                            usePointStyle: true,
                            callbacks: {
                                label: function(context) {
                                    const value = context.parsed.y;
                                    const diff = Math.round(value - latest[context.dataset.variantKey]);
                                    const arrow = diff > 0 ? '↑' : diff < 0 ? '↓' : '';
                                    const sign = diff > 0 ? '+' : diff < 0 ? '-' : '';
                                    const name = shown.length > 1 ? `${context.dataset.label}: ` : '';
                                    const point = context.dataset.goldPoints[context.dataIndex];
                                    if (point && !point.reported) {
                                        return `${name}${formatRupees(value)} (no report - last known rate from ${shortDate(point.fromDate)})`;
                                    }
                                    return `${name}${formatRupees(value)} (${sign}${Math.abs(diff).toLocaleString('en-IN')}${arrow})`;
                                },
                            },
                        },
                        // Today's rate written next to the last point of each line
                        datalabels: {
                            display: context => context.dataIndex === context.dataset.data.length - 1,
                            align: 'top',
                            anchor: 'end',
                            offset: 4,
                            color: context => context.dataset.borderColor,
                            font: { weight: 'bold', size: 13 },
                            formatter: value => formatRupees(value),
                        },
                    },
                },
                plugins: [ChartDataLabels],
            });
        }

        function setupGoldVariants() {
            const buttons = document.querySelectorAll('.gold-variant');
            for (const button of buttons) {
                button.addEventListener('click', () => {
                    goldVariant = button.dataset.variant;
                    buttons.forEach(b => b.setAttribute('aria-pressed', String(b === button)));
                    if (window.Chart && lastData) {
                        renderGoldChart(lastData.gold);
                    }
                });
            }
        }

        /**
         * Parse a "last_updated" value written by format_ist_timestamp() in the Python
         * scripts, e.g. "3 November 2026, 11:54 AM IST", into a UTC timestamp (ms).
         * Returns null if the text is missing or not in that format.
         */
        function parseIstTimestamp(text) {
            const match = /^(\d{1,2}) ([A-Za-z]+) (\d{4}), (\d{1,2}):(\d{2}) (AM|PM) IST$/.exec(text || '');
            if (!match) {
                return null;
            }
            const [, day, monthName, year, hour12, minute, meridiem] = match;
            const month = MONTH_NAMES.indexOf(monthName);
            if (month === -1) {
                return null;
            }
            const hour = (Number(hour12) % 12) + (meridiem === 'PM' ? 12 : 0);
            return Date.UTC(Number(year), month, Number(day), hour, Number(minute)) - IST_OFFSET_MS;
        }

        /**
         * The most recent UPDATE_DUE_HOUR_IST (midnight IST) at or before now, as a UTC timestamp (ms).
         */
        function lastUpdateDueTime() {
            // Shifting by the offset lets the UTC getters read IST wall-clock values
            const nowIst = new Date(Date.now() + IST_OFFSET_MS);
            const dayOffset = nowIst.getUTCHours() >= UPDATE_DUE_HOUR_IST ? 0 : -1;
            return Date.UTC(
                nowIst.getUTCFullYear(), nowIst.getUTCMonth(), nowIst.getUTCDate() + dayOffset, UPDATE_DUE_HOUR_IST
            ) - IST_OFFSET_MS;
        }

        /**
         * Show the status light: green "Updated" when the data was refreshed today (IST),
         * red "Not Updated" from midnight until the next data refresh.
         * The last update time (IST) is shown beside it.
         */
        let salonStatus = null;  // { time, isUpdated } for the Salon charts, from the last data load
        let goldStatus = null;   // the same for the Gold Rate Trends chart

        /** Status from a "last_updated" text: green when it was updated today (India time). */
        function statusFrom(lastUpdatedText) {
            const lastUpdated = parseIstTimestamp(lastUpdatedText);
            return {
                // "IST" is already in the label, so drop it from the time
                time: lastUpdatedText ? lastUpdatedText.replace(/\s*IST$/, '') : '-',
                isUpdated: lastUpdated !== null && lastUpdated >= lastUpdateDueTime(),
            };
        }

        function renderUpdateStatus(data) {
            salonStatus = statusFrom(data && data.daily && data.daily.last_updated);
            goldStatus = statusFrom(data && data.gold && data.gold.last_updated);
            // Gold is up to date only once today's Tanishq rate has been reported
            const goldHistory = (data && data.gold && data.gold.history) || [];
            const todayIst = new Date(Date.now() + IST_OFFSET_MS).toISOString().slice(0, 10);
            goldStatus.isUpdated = goldHistory.length > 0 && goldHistory[goldHistory.length - 1].date === todayIst;
            renderNavStatus();
        }

        /**
         * The Claude API pages keep their own "Last updated" time and status light (their top
         * bar is hidden inside the rotation); read them so the nav bar can show them instead.
         */
        function readClaudeStatus(slide) {
            try {
                const doc = slide.querySelector('iframe').contentDocument;
                const time = doc.getElementById('updTime');
                const light = doc.getElementById('status');
                if (!time || !light) {
                    return null;
                }
                const asOf = doc.getElementById('dataAsOf');
                return {
                    label: 'Last checked',
                    time: time.textContent.trim() || '-',
                    extra: asOf ? asOf.textContent.trim() : '',
                    isUpdated: light.classList.contains('ok'),
                };
            } catch (error) {
                return null;
            }
        }

        /**
         * Nav bar, right side: "Last updated" and the status light of the dashboard on screen.
         * Salon, Claude API and Gold each have one.
         */
        function renderNavStatus() {
            const slide = rotation.slides[rotation.index];
            let info = null;
            if (slide && slide.dataset.group === 'Salon') {
                info = salonStatus;
            } else if (slide && slide.dataset.group === 'Gold') {
                info = goldStatus;
            } else if (slide && slide.dataset.embed === 'claude') {
                info = readClaudeStatus(slide);
            }

            const status = document.getElementById('update-status');
            const lastUpdated = document.getElementById('last-updated');
            status.hidden = !info;
            lastUpdated.hidden = !info;
            if (!info) {
                return;
            }
            status.className = `update-status ${info.isUpdated ? 'updated' : 'pending'}`;
            document.getElementById('update-status-text').textContent = info.isUpdated ? 'Updated' : 'Not Updated';
            const label = info.label || 'Last updated';
            status.title = `${label}: ${info.time}`;
            document.getElementById('last-updated-label').textContent = label;
            document.getElementById('last-updated-text').textContent = info.time;
            // Claude API: "· Anthropic data as of ..." after the check time
            document.getElementById('last-updated-extra').textContent = info.extra ? ` ${info.extra}` : '';
        }

        /*
         * Chart library safety net. Chart.js and its labels plugin come from cdn.jsdelivr.net
         * (script tags in <head>). If that download fails, the same versions are loaded from a
         * second CDN, so a hiccup at one CDN never leaves the charts blank.
         */
        const CHART_LIBRARY_FALLBACKS = [
            { global: 'Chart', url: 'https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js' },
            { global: 'ChartDataLabels', url: 'https://cdnjs.cloudflare.com/ajax/libs/chartjs-plugin-datalabels/2.2.0/chartjs-plugin-datalabels.min.js' },
        ];

        function loadScript(url) {
            return new Promise(resolve => {
                const script = document.createElement('script');
                script.src = url;
                script.onload = () => resolve(true);
                script.onerror = () => {
                    script.remove();
                    resolve(false);
                };
                document.head.appendChild(script);
            });
        }

        /**
         * Make sure both chart libraries are loaded; returns true when they are.
         * Order matters: the labels plugin needs Chart.js to be there first.
         */
        async function ensureChartLibraries() {
            for (const lib of CHART_LIBRARY_FALLBACKS) {
                if (!window[lib.global]) {
                    console.warn(`${lib.global} did not load from the main CDN, trying ${lib.url}`);
                    await loadScript(lib.url);
                }
            }
            return Boolean(window.Chart && window.ChartDataLabels);
        }

        /**
         * Main render function: update all charts.
         * Each chart is drawn on its own, so one failing chart never stops the others.
         * A chart that cannot be drawn shows a "retrying" note; returns false in that case,
         * and the next auto-refresh tries again.
         */
        async function render(data) {
            lastData = data;
            await ensureChartLibraries();

            const charts = [
                ['yearly-sales-chart', () => renderYearlyChart(data.yearly)],
                ['weekly-sales-chart', () => renderWeeklyChart(data.daily)],
                ['daily-sales-chart', () => renderDailyChart(data.daily)],
                ['gold-rate-chart', () => renderGoldChart(data.gold)],
            ];
            let allDrawn = true;
            for (const [canvasId, draw] of charts) {
                const container = document.getElementById(canvasId).parentElement;
                try {
                    draw();
                    container.classList.remove('chart-error');
                } catch (error) {
                    allDrawn = false;
                    container.classList.add('chart-error');
                    console.error(`Could not draw ${canvasId}:`, error);
                }
            }
            renderUpdateStatus(data);
            return allDrawn;
        }

        /**
         * Redraw the chart that is on screen. The browser can wipe a chart's picture
         * (e.g. after the computer sleeps or the graphics driver resets) while the text
         * around it stays; redrawing whenever a chart comes on screen repairs that.
         */
        function redrawChart(canvas) {
            const chart = window.Chart && canvas ? Chart.getChart(canvas) : null;
            if (chart) {
                chart.resize();
                chart.update('none');
            }
        }

        function redrawVisibleChart() {
            const slide = rotation.slides[rotation.index];
            redrawChart(slide && slide.querySelector('canvas'));
        }

        /*
         * Chart rotation: the charts take turns on screen (Monthly -> Weekly -> Yearly -> ...),
         * SLIDE_INTERVAL_MS each. Rotation runs only when all of these are true:
         *   - the Play/Pause toggle is on Play,
         *   - nobody is using the screen (mouse, keyboard, touch or scroll pauses it; it resumes
         *     when the mouse leaves the dashboard, or after IDLE_RESUME_MS without activity),
         *   - the browser tab is visible.
         * Each time it resumes, the current chart gets a full SLIDE_INTERVAL_MS again.
         */
        const SLIDE_INTERVAL_MS = 10000;  // 10 seconds per chart
        const IDLE_RESUME_MS = 30000;     // Resume after 30 s without activity, e.g. a mouse left resting on the screen
        const MOUSE_MOVE_THRESHOLD_PX = 6;  // Smaller moves are sensor jitter, not someone using the screen

        const rotation = {
            slides: [],
            tabs: [],
            index: 0,
            isPlaying: true,      // Play/Pause toggle
            isUserActive: false,  // Someone is using the screen
            slideTimer: null,
            idleTimer: null,
            lastPointer: null,    // Mouse position {x, y} when a move last counted as activity
        };

        function isRotationRunning() {
            return rotation.isPlaying && !rotation.isUserActive && !document.hidden;
        }

        /**
         * Show the chart at the given position (wraps around) and restart the timer.
         */
        function showSlide(index) {
            const count = rotation.slides.length;
            rotation.index = (index + count) % count;
            rotation.slides.forEach((slide, i) => {
                const isActive = i === rotation.index;
                slide.classList.toggle('active', isActive);
                slide.setAttribute('aria-hidden', String(!isActive));
            });
            rotation.tabs.forEach((tab, i) => {
                tab.setAttribute('aria-current', String(i === rotation.index));
            });

            // Nav bar: which dashboard and page is on screen
            const slide = rotation.slides[rotation.index];
            const group = slide.dataset.group;
            document.querySelector('.app').dataset.group = group;
            document.getElementById('dashboard-name').textContent = `${group} · ${slide.dataset.slideName}`;
            renderNavStatus();
            // Keep the active tab visible when the tab strip is scrolled (narrow screens)
            const tab = rotation.tabs[rotation.index];
            if (tab) {
                const list = tab.closest('.slide-tabs');
                const listBox = list.getBoundingClientRect();
                const tabBox = tab.getBoundingClientRect();
                if (tabBox.left < listBox.left) {
                    list.scrollLeft -= listBox.left - tabBox.left + 8;
                } else if (tabBox.right > listBox.right) {
                    list.scrollLeft += tabBox.right - listBox.right + 8;
                }
            }

            redrawVisibleChart();
            scheduleNextSlide();
        }

        /*
         * Pages of the other dashboards are shown in iframes. They come from this same site,
         * so this page can adjust them each time one loads (they also reload themselves to
         * pick up new data):
         *   - hide what this page already provides: their page links, their own rotate and
         *     fullscreen buttons, and the Claude API left sidebar;
         *   - pass mouse/keyboard/touch activity inside them to the rotation, so using an
         *     embedded page pauses the rotation like the Salon charts do.
         */
        const EMBED_STYLES = {
            // Top bar (its "Last updated" and status light move to this page's nav bar) and
            // left bar hidden; the bottom bar keeps its controls but loses its bar background
            claude: `
                .app { grid-template-columns: 1fr !important; grid-template-rows: 1fr auto !important;
                       grid-template-areas: "main" "bottom" !important; }
                .topbar, .leftbar, #rotBtn, #fsBtn, #rotBar { display: none !important; }
                .bottombar { background: transparent !important; border: 0 !important; }`,
        };

        function adjustEmbeddedPage(slide, frame) {
            try {
                const doc = frame.contentDocument;
                if (!doc || !doc.head || doc.getElementById('rotation-embed-style')) {
                    return;  // Not loaded yet, or already adjusted
                }
                const style = doc.createElement('style');
                style.id = 'rotation-embed-style';
                style.textContent = EMBED_STYLES[slide.dataset.embed] || '';
                doc.head.appendChild(style);
                for (const type of ['mousemove', 'mousedown', 'wheel', 'keydown', 'touchstart']) {
                    doc.addEventListener(type, handleUserActivity, { passive: true });
                }
                // Claude API: show its "Last updated" and status light in the nav bar, and
                // follow them when the page refreshes its data
                if (slide.dataset.embed === 'claude') {
                    const watched = ['updTime', 'status', 'dataAsOf'].map(id => doc.getElementById(id)).filter(Boolean);
                    const observer = new MutationObserver(renderNavStatus);
                    for (const element of watched) {
                        observer.observe(element, { attributes: true, childList: true, characterData: true, subtree: true });
                    }
                    renderNavStatus();
                }
            } catch (error) {
                console.warn('Could not adjust embedded page', frame.src, error);
            }
        }

        function setupEmbeds() {
            for (const slide of document.querySelectorAll('.embed-card')) {
                const frame = slide.querySelector('iframe');
                // On every load, including the pages' own reloads
                frame.addEventListener('load', () => adjustEmbeddedPage(slide, frame));
                // Load a fresh copy: browsers keep GitHub Pages files for up to 10 minutes,
                // and pages inside frames are often not refreshed even by Ctrl+F5
                frame.src = `${frame.dataset.src}?v=${Date.now()}`;
            }
        }

        /**
         * (Re)start the countdown to the next chart, or stop it when rotation is paused.
         */
        function scheduleNextSlide() {
            clearTimeout(rotation.slideTimer);
            rotation.slideTimer = null;

            const progress = document.getElementById('rotation-progress');
            progress.style.transition = 'none';
            progress.style.width = '0';

            if (isRotationRunning()) {
                void progress.offsetWidth;  // Apply the reset before starting the fill
                progress.style.transition = `width ${SLIDE_INTERVAL_MS}ms linear`;
                progress.style.width = '100%';
                rotation.slideTimer = setTimeout(() => showSlide(rotation.index + 1), SLIDE_INTERVAL_MS);
            }
            renderRotationControls();
        }

        /**
         * Update the Play/Pause button and the note on the right of the status bar.
         */
        function renderRotationControls() {
            const toggle = document.getElementById('rotation-toggle');
            toggle.classList.toggle('is-paused', !rotation.isPlaying);
            toggle.setAttribute('aria-label', rotation.isPlaying ? 'Pause rotation' : 'Play rotation');
            document.getElementById('rotation-toggle-text').textContent = rotation.isPlaying ? 'Pause' : 'Play';

            let note = '';
            if (!rotation.isPlaying) {
                note = 'Rotation paused';
            } else if (rotation.isUserActive) {
                note = 'Paused while you use the dashboard - move the mouse away to resume';
            }
            document.getElementById('rotation-note').textContent = note;
        }

        /**
         * Any activity on the dashboard pauses the rotation until the mouse leaves
         * or the screen has been left alone for IDLE_RESUME_MS.
         */
        function handleUserActivity(event) {
            if (event.type === 'mousemove') {
                // Browsers also send mousemove when the mouse has not moved (e.g. when the chart
                // under it changes), and some mice/touchpads jitter by a pixel or two while resting.
                // Only a real move away from the last counted position is activity.
                const last = rotation.lastPointer;
                if (last && Math.hypot(event.screenX - last.x, event.screenY - last.y) < MOUSE_MOVE_THRESHOLD_PX) {
                    return;
                }
                rotation.lastPointer = { x: event.screenX, y: event.screenY };
            }

            clearTimeout(rotation.idleTimer);
            rotation.idleTimer = setTimeout(resumeAfterActivity, IDLE_RESUME_MS);

            if (!rotation.isUserActive) {
                rotation.isUserActive = true;
                scheduleNextSlide();
            }
        }

        function resumeAfterActivity() {
            clearTimeout(rotation.idleTimer);
            rotation.idleTimer = null;
            // lastPointer is kept: a mouse still resting in the same spot must not pause it again
            if (rotation.isUserActive) {
                rotation.isUserActive = false;
                scheduleNextSlide();
            }
        }

        function setupRotation() {
            rotation.slides = Array.from(document.querySelectorAll('.chart-card'));

            // One tab per page in the status bar, grouped by dashboard; clicking one jumps to it
            const tabList = document.getElementById('slide-tabs');
            const groups = new Map();
            rotation.tabs = rotation.slides.map((slide, i) => {
                let group = groups.get(slide.dataset.group);
                if (!group) {
                    group = document.createElement('div');
                    group.className = 'tab-group';
                    const label = document.createElement('span');
                    label.className = 'tab-group-label';
                    label.textContent = slide.dataset.group;
                    group.appendChild(label);
                    tabList.appendChild(group);
                    groups.set(slide.dataset.group, group);
                }
                const tab = document.createElement('button');
                tab.type = 'button';
                tab.className = 'slide-tab';
                tab.textContent = slide.dataset.slideName;
                tab.addEventListener('click', () => showSlide(i));
                group.appendChild(tab);
                return tab;
            });
            setupEmbeds();

            document.getElementById('rotation-toggle').addEventListener('click', () => {
                rotation.isPlaying = !rotation.isPlaying;
                scheduleNextSlide();
            });

            for (const type of ['mousemove', 'mousedown', 'wheel', 'keydown', 'touchstart']) {
                document.addEventListener(type, handleUserActivity, { passive: true });
            }
            // Mouse moved off the dashboard (or out of the browser window): resume
            document.documentElement.addEventListener('mouseleave', resumeAfterActivity);
            // Pause while the tab is in the background; redraw the chart when it comes back
            document.addEventListener('visibilitychange', () => {
                if (!document.hidden) {
                    redrawVisibleChart();
                }
                scheduleNextSlide();
            });
            // The browser lost and then restored a chart's drawing surface: draw it again
            for (const canvas of document.querySelectorAll('canvas')) {
                canvas.addEventListener('contextrestored', () => redrawChart(canvas));
            }

            showSlide(0);
        }

        // Start fetching data now, while the deferred chart libraries are still downloading
        const initialDataPromise = loadDashboardData();

        /**
         * Initialize the dashboard and set up auto-refresh.
         */
        async function init() {
            console.log('Initializing dashboard...');
            setupRotation();
            setupGoldVariants();

            // Initial load
            let needsRedraw = false;  // A chart could not be drawn last time: try again on the next refresh
            const data = await initialDataPromise;
            if (data) {
                needsRedraw = !(await render(data));
                lastDataString = JSON.stringify(data);
            } else {
                renderUpdateStatus(null);  // No data could be loaded: show pending
            }

            // Set up auto-refresh
            setInterval(async () => {
                // Turns the light red at midnight even when the data has not changed
                renderUpdateStatus(lastData);

                // No polling while the tab is in the background
                if (document.hidden) {
                    return;
                }
                const freshData = await loadDashboardData();
                if (freshData) {
                    const freshDataString = JSON.stringify(freshData);
                    if (freshDataString !== lastDataString || needsRedraw) {
                        console.log(needsRedraw ? 'Retrying charts that could not be drawn...' : 'Dashboard data changed, updating...');
                        needsRedraw = !(await render(freshData));
                        lastDataString = freshDataString;
                    }
                }
            }, AUTO_REFRESH_INTERVAL_MS);
        }

        // Start when DOM is ready
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    </script>
</body>
</html>
