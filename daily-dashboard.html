<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sales Dashboard</title>

    <!-- Chart.js library -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.js"></script>
    <!-- Chart.js Data Labels Plugin -->
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
            background-color: #fff;
            padding: 16px 24px;
            font-size: 16px;
        }

        /* Full-screen layout: nav, KPI row, weekly chart, daily chart */
        .container {
            max-width: 1400px;
            height: 100%;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* Header row: KPI cards (left) + stacked nav buttons (right) */
        .header {
            display: flex;
            gap: 12px;
            align-items: stretch;
        }

        .header .kpi-cards {
            flex: 1;
            min-width: 0;
        }

        .nav-bar {
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 8px;
        }

        .nav-link {
            text-align: center;
            padding: 6px 18px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 700;
            text-decoration: none;
            color: #666;
            background-color: #f7f7f7;
        }

        .nav-link.active {
            color: #fff;
            background-color: #1ca0f2;
        }

        /* KPI Cards Row */
        .kpi-cards {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 12px;
        }

        .kpi-card {
            min-width: 0;
            background-color: #f7f7f7;
            border-radius: 12px;
            padding: 10px 14px;
        }

        .kpi-value {
            font-size: 28px;
            font-weight: 700;
            color: #000;
            line-height: 1.2;
            margin-bottom: 4px;
        }

        .kpi-label {
            font-size: 16px;
            color: #666;
            font-weight: 700;
            line-height: 1.3;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Chart Cards share the remaining screen height equally */
        .chart-card {
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
            background-color: #fff;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 12px 16px;
        }

        .chart-title {
            font-size: 14px;
            color: #333;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .chart-container {
            position: relative;
            flex: 1;
            min-height: 0;
            width: 100%;
        }

        canvas {
            max-width: 100%;
        }

        /* Tablet: smaller KPI text so labels stay on one line */
        @media (max-width: 1100px) {
            .kpi-value {
                font-size: 22px;
            }

            .kpi-label {
                font-size: 13px;
            }
        }

        /* Phone, or a very short window: normal page flow with fixed chart heights */
        @media (max-width: 768px), (max-height: 560px) {
            html, body {
                height: auto;
            }

            body {
                padding: 16px;
            }

            .container {
                height: auto;
            }

            .chart-card {
                flex: none;
            }

            .chart-container {
                flex: none;
                height: 240px;
            }
        }

        @media (max-width: 768px) {
            /* Phone: nav buttons side by side above the KPI cards */
            .header {
                flex-direction: column;
            }

            .nav-bar {
                order: -1;
                flex-direction: row;
                justify-content: flex-end;
            }

            .kpi-cards {
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
            }

            /* Odd card out fills the last row */
            .kpi-card:last-child {
                grid-column: span 2;
            }

            .kpi-value {
                font-size: 22px;
            }

            .kpi-label {
                font-size: 13px;
            }

            .nav-link {
                padding: 6px 14px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header: KPI Cards + Nav -->
        <div class="header">
            <div class="kpi-cards">
                <div class="kpi-card">
                    <div class="kpi-value" id="current-week-sales">-</div>
                    <div class="kpi-label">Current Week Sales</div>
                </div>
                <div class="kpi-card">
                    <div class="kpi-value" id="current-week-balance">-</div>
                    <div class="kpi-label">Current Week Balance</div>
                </div>
                <div class="kpi-card">
                    <div class="kpi-value" id="remaining-days">-</div>
                    <div class="kpi-label">Remaining Days</div>
                </div>
                <div class="kpi-card">
                    <div class="kpi-value" id="previous-week-sales">-</div>
                    <div class="kpi-label">Previous Week Sales</div>
                </div>
                <div class="kpi-card">
                    <div class="kpi-value" id="monthly-sales">-</div>
                    <div class="kpi-label">Monthly Sales</div>
                </div>
            </div>
            <nav class="nav-bar">
                <a href="daily-dashboard.html" class="nav-link active">Daily</a>
                <a href="monthly-dashboard.html" class="nav-link">Monthly</a>
            </nav>
        </div>

        <!-- Weekly Chart Section -->
        <div class="chart-card">
            <div class="chart-title" id="weekly-chart-title">Current Weekly</div>
            <div class="chart-container">
                <canvas id="weekly-sales-chart"></canvas>
            </div>
        </div>

        <!-- Daily Chart Section -->
        <div class="chart-card">
            <div class="chart-title" id="chart-title">-</div>
            <div class="chart-container">
                <canvas id="daily-sales-chart"></canvas>
            </div>
        </div>
    </div>

    <script>
        // Constants
        const AUTO_REFRESH_INTERVAL_MS = 30000;  // 30 seconds
        const CHART_DATA_URL = "daily-dashboard-data.json";
        const BAR_COLOR = '#1ca0f2';
        const LABEL_COLOR = '#f17777';

        let dailyChart = null;
        let weeklyChart = null;
        let lastDataString = null;  // For change detection

        /**
         * Format a number with thousands separators.
         * Example: 17629 -> "17,629"
         */
        function formatNumber(num) {
            if (typeof num !== 'number') {
                return String(num);
            }
            return Math.floor(num).toLocaleString('en-US');
        }

        /**
         * Fetch dashboard data from JSON file with cache-busting.
         */
        async function loadDashboardData() {
            try {
                const url = `${CHART_DATA_URL}?t=${Date.now()}`;
                const response = await fetch(url, { cache: 'no-store' });
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const data = await response.json();
                return data;
            } catch (error) {
                console.error('Failed to load dashboard data:', error);
                return null;
            }
        }

        /**
         * Render KPI cards with data.
         */
        function renderKPICards(data) {
            if (!data) {
                console.log('No data to render');
                return;
            }

            document.getElementById('current-week-sales').textContent = formatNumber(data.current_week_sales);
            document.getElementById('current-week-balance').textContent = formatNumber(data.current_week_balance);
            document.getElementById('remaining-days').textContent = formatNumber(data.remaining_days);
            document.getElementById('previous-week-sales').textContent = formatNumber(data.previous_week_sales);
            document.getElementById('monthly-sales').textContent = formatNumber(data.monthly_sales);
        }

        /**
         * Horizontal space available per bar, in pixels.
         */
        function barWidth(chart) {
            return chart.chartArea ? chart.chartArea.width / chart.data.labels.length : chart.width;
        }

        /**
         * Create a bar chart with value labels above each bar.
         * extraDatasets are drawn on top of the bars (e.g. a target line).
         */
        function createBarChart(canvasId, labels, values, { showXLabels, suggestedMax, extraDatasets = [] }) {
            const ctx = document.getElementById(canvasId).getContext('2d');

            return new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [
                        ...extraDatasets,
                        {
                            label: 'Sales',
                            data: values,
                            backgroundColor: BAR_COLOR,
                            borderColor: BAR_COLOR,
                            borderWidth: 0,
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    indexAxis: 'x',
                    layout: {
                        // Room for the value labels above the tallest bar
                        padding: { top: 24 }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            suggestedMax: suggestedMax,
                            // 10% headroom so the tallest bar never touches the top
                            grace: '10%',
                            ticks: {
                                maxTicksLimit: 5,
                                callback: function(value) {
                                    return value.toLocaleString('en-US');
                                }
                            },
                            grid: {
                                drawBorder: true,
                                color: 'rgba(0, 0, 0, 0.1)',
                                lineWidth: 1,
                            }
                        },
                        x: {
                            ticks: {
                                display: showXLabels,
                                maxRotation: 0,
                                autoSkip: false,
                                font: function(context) {
                                    return { size: barWidth(context.chart) < 60 ? 10 : 12 };
                                }
                            },
                            grid: {
                                display: false,
                            }
                        }
                    },
                    plugins: {
                        legend: {
                            display: false
                        },
                        datalabels: {
                            display: true,
                            anchor: 'end',
                            align: 'end',
                            offset: 2,
                            color: LABEL_COLOR,
                            // Shrink labels on narrow charts; turn them vertical when bars are thin
                            rotation: function(context) {
                                return barWidth(context.chart) < 40 ? -90 : 0;
                            },
                            font: function(context) {
                                const width = barWidth(context.chart);
                                return {
                                    weight: 'bold',
                                    size: width < 40 ? 10 : width < 60 ? 13 : 16,
                                };
                            },
                            formatter: function(value) {
                                return value.toLocaleString('en-US');
                            }
                        }
                    }
                },
                plugins: [ChartDataLabels]
            });
        }

        /**
         * Render daily bar chart.
         */
        function renderDailyChart(data) {
            // Destroy existing chart if it exists, so stale data never lingers on screen
            if (dailyChart) {
                dailyChart.destroy();
                dailyChart = null;
            }

            if (!data || !data.daily_chart_data || data.daily_chart_data.length === 0) {
                console.log('No daily chart data to render');
                return;
            }

            const dates = data.daily_chart_data.map(d => d.date);
            const sales = data.daily_chart_data.map(d => d.daily_sales);

            // Chart title is the month and year of the data, e.g. "November 2026".
            // The year comes from last_updated ("2 November 2026, 10:00 AM IST").
            const yearMatch = (data.last_updated || '').match(/\d{4}/);
            const year = yearMatch ? yearMatch[0] : new Date().getFullYear();
            document.getElementById('chart-title').textContent = `${dates[0].split(' ')[0]} ${year}`;

            dailyChart = createBarChart('daily-sales-chart', dates, sales, {
                showXLabels: false,
            });
        }

        /**
         * ISO week number of the year (weeks start Monday, matching the weekly data).
         * Example: 2 November 2026 -> 45
         */
        function isoWeekNumber(date) {
            const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
            const dayOfWeek = d.getUTCDay() || 7;  // Sunday -> 7
            d.setUTCDate(d.getUTCDate() + 4 - dayOfWeek);  // Thursday of this week
            const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
            return Math.ceil(((d - yearStart) / 86400000 + 1) / 7);
        }

        /**
         * Render weekly bar chart with a dashed weekly target line.
         */
        function renderWeeklyChart(data) {
            if (weeklyChart) {
                weeklyChart.destroy();
                weeklyChart = null;
            }

            const target = data && data.weekly_target;
            const targetText = target ? ` (target ${formatNumber(target)})` : '';
            document.getElementById('weekly-chart-title').textContent =
                `Current Weekly ${isoWeekNumber(new Date())}${targetText}`;

            if (!data || !data.weekly_chart_data || data.weekly_chart_data.length === 0) {
                console.log('No weekly chart data to render');
                return;
            }

            // Two-line labels, e.g. "28 Sep - 4 Oct" -> ["28 Sep -", "4 Oct"], so they fit on phones
            const weeks = data.weekly_chart_data.map(d => d.week.replace(' - ', ' -\n').split('\n'));
            const sales = data.weekly_chart_data.map(d => d.weekly_sales);
            const extraDatasets = [];

            if (target) {
                extraDatasets.push({
                    type: 'line',
                    label: 'Target',
                    data: weeks.map(() => target),
                    borderColor: LABEL_COLOR,
                    borderWidth: 2,
                    borderDash: [6, 4],
                    pointRadius: 0,
                    datalabels: { display: false },
                });
            }

            weeklyChart = createBarChart('weekly-sales-chart', weeks, sales, {
                showXLabels: true,
                // Keep the target line in view even when every week is below it
                suggestedMax: target,
                extraDatasets: extraDatasets,
            });
        }

        /**
         * Main render function: update KPI cards and charts.
         */
        function render(data) {
            renderKPICards(data);
            renderWeeklyChart(data);
            renderDailyChart(data);
        }

        /**
         * Initialize the dashboard and set up auto-refresh.
         */
        async function init() {
            console.log('Initializing dashboard...');

            // Initial load
            const data = await loadDashboardData();
            if (data) {
                render(data);
                lastDataString = JSON.stringify(data);
            }

            // Set up auto-refresh
            setInterval(async () => {
                const freshData = await loadDashboardData();
                if (freshData) {
                    const freshDataString = JSON.stringify(freshData);
                    if (freshDataString !== lastDataString) {
                        console.log('Dashboard data changed, updating...');
                        render(freshData);
                        lastDataString = freshDataString;
                    }
                }
            }, AUTO_REFRESH_INTERVAL_MS);
        }

        // Start when DOM is ready
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    </script>
</body>
</html>
